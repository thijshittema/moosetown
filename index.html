<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>MooseTown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header with garden switch + tabs; map-first workspace with a detail column that stacks on phones. */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --surface-2:#E4E9E0; --ink:#1B2A21; --muted:#56655B; --line:#CFD7CA;
  --accent:#7A2E55; --accent-ink:#FFFFFF; --leaf:#2F6E3E; --warn:#A8591A; --danger:#B3261E;
  --grass:#DCE6D3; --grass-line:#C7D4BD; --soil:#6E5039; --soil-2:#7E5D44; --soil-ink:#FFF7EE; --path:#D9D2C3; --path-line:#B9AF9B; --lawn:#9CC77E; --lawn-2:#92BE73; --hedge:#2F5A3A; --hedge-2:#3D6E47; --water:#8EC3DA; --water-2:#5E9FBF; --roof:#B9B4AC; --roof-line:#9C968C; --mulch:#5C4331;
  --glass:#D6ECF2; --glass-line:#A9CFDB; --glass-ink:#173A45; --seed:#B88A3E; --fruit:#C8402E;
  --stake:#9A7B55; --c-red:#D9412F; --c-yellow:#E9B824; --c-pod:#3F8E36; --c-pea:#86C25A; --c-purple:#6B3A8C; --c-zuc:#2E6B2E; --c-cuc:#4F9A3E; --c-orange:#E8862A; --c-rib:#9C4F12; --c-cream:#EADCB8; --c-beet:#8E1F3E; --c-radish:#E0507A; --c-onion:#D9A441; --c-garlic:#F1EBDD; --c-kool:#5E8F86; --c-kale:#2F5A3A; --c-kohl:#A8CF8A; --c-broc:#3D6E3A; --c-potato:#CDA86A; --c-corn:#F2C230; --c-light:#A9D67A; --c-beanseed:#E9DFC8;
  --f-kool:#2F6FA8; --f-nacht:#C0392B; --f-peul:#2E8B57; --f-scherm:#D17A12; --f-ui:#8E5BB5; --f-kom:#B59A12; --f-compo:#3C9C9C; --f-amarant:#A23B6B; --f-overig:#6F7A72;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19211C; --surface-2:#222C25; --ink:#E3EAE1; --muted:#98A79C; --line:#2E3A32;
  --accent:#D77EA9; --accent-ink:#1C0E15; --leaf:#7CC08A; --warn:#E3A060; --danger:#F08A80;
  --grass:#1D2A21; --grass-line:#26352A; --soil:#4E3A2B; --soil-2:#5A4332; --soil-ink:#FBEFE2; --path:#4A463D; --path-line:#5E584C; --lawn:#3E5E33; --lawn-2:#38552E; --hedge:#1F3A27; --hedge-2:#2A4C33; --water:#25506A; --water-2:#3A7194; --roof:#4A4743; --roof-line:#5C5853; --mulch:#3E2E22;
  --glass:#1E3A44; --glass-line:#2F5866; --glass-ink:#DDF2F8; --seed:#D9AE62; --fruit:#F07A63;
  --f-kool:#6FA8DC; --f-nacht:#EF7B6E; --f-peul:#6CCB94; --f-scherm:#F0A65A; --f-ui:#B892DA; --f-kom:#D9C45A; --f-compo:#6CC9C9; --f-amarant:#DC7AA7; --f-overig:#A3AFA7;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211C; --surface-2:#222C25; --ink:#E3EAE1; --muted:#98A79C; --line:#2E3A32;
  --accent:#D77EA9; --accent-ink:#1C0E15; --leaf:#7CC08A; --warn:#E3A060; --danger:#F08A80;
  --grass:#1D2A21; --grass-line:#26352A; --soil:#4E3A2B; --soil-2:#5A4332; --soil-ink:#FBEFE2; --path:#4A463D; --path-line:#5E584C; --lawn:#3E5E33; --lawn-2:#38552E; --hedge:#1F3A27; --hedge-2:#2A4C33; --water:#25506A; --water-2:#3A7194; --roof:#4A4743; --roof-line:#5C5853; --mulch:#3E2E22;
  --glass:#1E3A44; --glass-line:#2F5866; --glass-ink:#DDF2F8; --seed:#D9AE62; --fruit:#F07A63;
  --f-kool:#6FA8DC; --f-nacht:#EF7B6E; --f-peul:#6CCB94; --f-scherm:#F0A65A; --f-ui:#B892DA; --f-kom:#D9C45A; --f-compo:#6CC9C9; --f-amarant:#DC7AA7; --f-overig:#A3AFA7;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
.data{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-size:.85em}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:1.5rem}
.brand svg{flex:none}
.gsel{display:flex;gap:6px;align-items:center}
.gsel select{max-width:13rem}
.me{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
nav.tabs{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 12px 10px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:3px 9px;font-size:.8rem}
.btn.danger{color:var(--danger)}
.btn[data-armed]{background:var(--danger);color:var(--surface);border-color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.readonly .w{display:none!important}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.work{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}

/* map */
.mapwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.map{position:relative;width:100%;border-radius:var(--r);border:1px solid var(--line);
  background-color:var(--grass);
  background-image:linear-gradient(var(--grass-line) 1px,transparent 1px),linear-gradient(90deg,var(--grass-line) 1px,transparent 1px);
  max-height:70vh}
.bed{position:absolute;border-radius:6px;cursor:pointer;overflow:hidden;border:2px solid transparent;padding:6px;color:var(--soil-ink);
  background:repeating-linear-gradient(0deg,var(--soil) 0 7px,var(--soil-2) 7px 12px);display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit}
.bed:hover{border-color:var(--soil-ink)}
.bed[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.bed .bn{font-family:var(--font-display);font-weight:700;font-size:.85rem;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bed .crops{display:flex;flex-wrap:wrap;gap:3px}
.bed .dot{font-size:.68rem;padding:1px 6px;border-radius:99px;background:var(--surface);color:var(--ink);border-left:4px solid var(--fc);white-space:nowrap}
.ruler{display:flex;justify-content:space-between;font-family:var(--font-data);font-size:.7rem;color:var(--muted)}

.map.editing .bed{touch-action:none;cursor:move;border:2px dashed var(--soil-ink)}
.map.editing .bed:active{cursor:grabbing}
.bed .rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--accent) 50%)}
.bed .sz{font-size:.68rem;background:var(--surface);color:var(--ink);border-radius:4px;padding:0 4px;align-self:flex-start}
.chip.succ{cursor:pointer;font:inherit;font-size:.78rem;font-weight:700;color:inherit}
.chip.succ:hover{border-color:var(--fc)}
/* kas */
.bed.kas{color:var(--glass-ink);background:linear-gradient(135deg,color-mix(in srgb,#fff 35%,transparent) 0 18%,transparent 18% 100%),repeating-linear-gradient(90deg,var(--glass) 0 22px,var(--glass-line) 22px 24px);border-color:var(--glass-line)}
.bed.kas .bn{text-shadow:none}
.tag{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--glass);color:var(--glass-ink);border:1px solid var(--glass-line);vertical-align:middle}
.b-k{background:var(--glass-line)}
/* groeistadia */
.stg{display:block;flex:none}
.strip{display:flex;align-items:center;gap:2px;margin-top:4px;flex-wrap:wrap}
.strip .st{display:inline-flex;padding:2px;border-radius:6px}
.strip .st.past{opacity:.45}
.strip .st.next{opacity:.18;filter:grayscale(1)}
.strip .st.cur{background:color-mix(in srgb,var(--leaf) 16%,var(--surface));outline:1.5px solid var(--leaf)}
.strip .stname{font-size:.78rem;font-weight:700;margin-left:6px}
.bed .dot{display:inline-flex;align-items:center;gap:2px}
.bed .dot .stg{width:13px;height:13px}
/* weerbericht */
.fc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.fcd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:8px;background:var(--surface-2);font-size:.8rem;min-width:0}
.fcd.frost{background:color-mix(in srgb,var(--glass) 70%,var(--surface));outline:1px solid var(--glass-line)}
.fcd .rain{font-size:.68rem;color:var(--muted);white-space:nowrap}
/* taken */
.item.todo{border-left:4px solid transparent;padding-left:8px}
.item.todo.p1{border-left-color:var(--danger)}
.item.todo.p2{border-left-color:var(--warn)}
.item.todo.p3{border-left-color:var(--line)}
.pill.pr1{color:var(--danger);border-color:var(--danger)}
.pill.pr2{color:var(--warn);border-color:var(--warn)}
/* plattegrond met vrije vormen */
.map{margin-inline:auto}
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.shp{cursor:pointer;stroke:transparent;stroke-width:2;stroke-linejoin:round}
.shp.bed{fill:url(#pSoil)} .shp.kas{fill:url(#pKas);stroke:var(--glass-line)} .shp.pad{fill:url(#pPad);stroke:var(--path-line)}
.shp:hover{stroke:var(--ink)}
.shp.sel{stroke:var(--accent);stroke-width:3}
.map.editing .shp{stroke:var(--ink);stroke-dasharray:6 4;cursor:move;touch-action:none}
.map.editing .shp.sel{stroke:var(--accent);stroke-width:3}
.map.drawing,.map.drawing .shp{cursor:crosshair}
.outside{fill:var(--bg);opacity:.85;pointer-events:none}
.gline{fill:none;stroke:var(--leaf);stroke-width:2;pointer-events:none}
.draft{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:2;stroke-dasharray:5 3;pointer-events:none}
.ovl{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;max-width:42%;text-align:center}
.lbl .bn{font-family:var(--font-display);font-weight:700;font-size:.78rem;line-height:1.15;background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--ink);padding:1px 6px;border-radius:5px}
.lbl.padl .bn{font-weight:500;font-size:.7rem;opacity:.85}
.lbl .crops{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.lbl .dot{display:inline-flex;align-items:center;gap:2px;font-size:.66rem;padding:1px 6px;border-radius:99px;background:var(--surface);color:var(--ink);border-left:4px solid var(--fc);white-space:nowrap}
.lbl .dot .stg{width:13px;height:13px}
.vh,.mh,.dp{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none}
.vh{width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mh{width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/18px var(--font-body);text-align:center;cursor:copy;opacity:.75}
.mh:hover{opacity:1}
.dp{width:10px;height:10px;border-radius:50%;background:var(--accent);pointer-events:none}
.dp.first{width:18px;height:18px;background:var(--surface);border:3px solid var(--accent)}
.shp.out{stroke:var(--danger)!important;stroke-width:3;stroke-dasharray:4 3}
.el{position:absolute;transform:translate(calc(-50% + var(--nx,0) * 22px),calc(-50% + var(--ny,0) * 22px));font:600 11px/1 var(--font-data);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:2px 5px;white-space:nowrap;pointer-events:none}
.el.edit{pointer-events:auto;cursor:pointer;border-color:var(--accent)}
.el.edit:hover{background:var(--accent);color:var(--accent-ink)}
.el.live{border-color:var(--accent);color:var(--accent)}
.dline{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3;pointer-events:none}
.flash{color:var(--danger);font-weight:700;font-size:.85rem}
.shapeprev{width:140px;height:100px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--grass)}
.shapeprev polygon{fill:var(--soil);stroke:var(--ink);stroke-width:1.5}
.shp.k-border{fill:url(#pBorder)} .shp.k-gazon{fill:url(#pGazon)} .shp.k-haag{fill:url(#pHaag)} .shp.k-vijver{fill:url(#pWater);stroke:var(--water-2)} .shp.k-terras{fill:url(#pTerras);stroke:var(--path-line)} .shp.k-gebouw{fill:url(#pGebouw);stroke:var(--roof-line)}
.plt{fill:color-mix(in srgb,var(--pc) 30%,transparent);stroke:var(--pc);stroke-width:1.5;cursor:pointer}
.plt:hover{stroke-width:2.5} .plt.sel{stroke:var(--accent);stroke-width:3} .map.editing .plt{cursor:move;touch-action:none} .pdot{pointer-events:none}
.plbl{position:absolute;transform:translate(-50%,3px);font-size:.62rem;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:0 4px;border-radius:4px;white-space:nowrap;pointer-events:none}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px} .mgrid label{display:flex;align-items:center;gap:3px;font-size:.78rem} .mgrid input{width:auto}
.b-bl{background:var(--c-yellow)} .b-sn{background:var(--accent)} .b-zg{background:var(--leaf)}
.toolbar select{width:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.78rem;font-weight:700;
  background:color-mix(in srgb,var(--fc,var(--f-overig)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--fc,var(--f-overig)) 45%,var(--surface));white-space:nowrap}
.chip.warn{outline:2px dashed var(--warn);outline-offset:1px}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.pill.s-gepland{border-color:var(--muted)}
.pill.s-gezaaid{background:color-mix(in srgb,var(--leaf) 18%,var(--surface));border-color:var(--leaf)}
.pill.s-uitgeplant{background:color-mix(in srgb,var(--leaf) 30%,var(--surface));border-color:var(--leaf)}
.pill.s-oogst{background:color-mix(in srgb,var(--warn) 25%,var(--surface));border-color:var(--warn)}
.pill.s-afgerond{opacity:.7}
.late{color:var(--danger);font-weight:700}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .when{font-family:var(--font-data);font-size:.8rem;color:var(--muted);min-width:4.2rem}
.item .main{min-width:0}
.item .main b{font-weight:700}
.item .sub{font-size:.85rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px}
.stat .v{font-family:var(--font-data);font-size:1.3rem;font-weight:600}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.cal td,.cal th{padding:6px 4px;text-align:center}
.cal td:first-child,.cal th:first-child{text-align:left;padding-left:10px;white-space:nowrap}
.cal .now{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bars{display:flex;flex-direction:column;gap:2px;min-width:22px}
.bars i{display:block;height:5px;border-radius:3px}
.b-bi{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 6px)}
.b-bu{background:var(--leaf)}
.b-o{background:var(--warn)}
.b-x{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.hbar{height:8px;border-radius:4px;background:var(--warn)}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:640px}
.notice{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 50%,var(--surface));border-radius:8px;padding:8px 12px;font-size:.88rem}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:.8rem;font-weight:700;color:var(--muted)}
.err{color:var(--danger);font-size:.88rem}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.bed,.btn{transition:border-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<header>

function successors(bedId){
  const b=S.beds.find(x=>x.id===bedId);
  const open=plantsOf(bedId).filter(p=>p.status!=='afgerond');
  let start=today();
  open.forEach(p=>{const h=expHarvest(p);if(h&&h>start)start=h});
  const y=parse(start).getFullYear(),m=parse(start).getMonth()+1,m2=m%12+1;
  const blocked=new Set(open.map(famOf));
  const sowFor=c=>sowWin(c,b).includes(m)?start:`${m===12?y+1:y}-${pad(m2)}-01`;
  const list=CROPS.filter(c=>{
    const win=sowWin(c,b);
    if(!(win.includes(m)||win.includes(m2)))return false;
    if(blocked.has(c.f)&&c.f!=='overig')return false;
    if(rotWarn(bedId,c.f,y+(m>=10?1:0)).length)return false;
    const sow=sowFor(c);
    return c.w||addDays(sow,c.d)<=SEASON_END(parse(sow).getFullYear(),b);
  }).map(c=>({c,sow:sowFor(c),cap:capacity(b,c)})).sort((a,b2)=>a.c.d-b2.c.d);
  return {start,open,list};
}

/* ---------- takenlijst: wat moet ik nu doen ---------- */
const WEATHER={normaal:'Gewoon weer',vorst:'Vorst verwacht',droog:'Warm en droog',regen:'Veel regen',storm:'Storm of harde wind'};
/* weerbericht van Open-Meteo (gratis, geen sleutel), per tuin met coördinaten, hooguit eens per uur */
S.fc={};
const WD=['zo','ma','di','wo','do','vr','za'];
function fcKind(days){
  const n=days.slice(0,3),rain=n.reduce((s,x)=>s+(x.rain||0),0);
  if(n.some(x=>x.min!=null&&x.min<=1))return 'vorst';
  if(n.some(x=>x.gust!=null&&x.gust>=75))return 'storm';
  if(rain>=15)return 'regen';
  if(n.some(x=>x.max!=null&&x.max>=24)&&rain<2)return 'droog';
  return 'normaal';
}
async function loadForecast(g){
  if(!g||g.lat==null||g.lon==null||g.lat===''||g.lon==='')return;
  const key=g.lat+','+g.lon,c=S.fc[g.id];
  if(c&&c.key===key&&Date.now()-c.at<3600e3)return;
  S.fc[g.id]={key,at:Date.now(),loading:true};
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(g.lat)}&longitude=${encodeURIComponent(g.lon)}&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,wind_gusts_10m_max&timezone=Europe%2FAmsterdam&forecast_days=7`;
    const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
    const d=(await r.json()).daily;
    const days=d.time.map((t,i)=>({d:t,min:d.temperature_2m_min[i],max:d.temperature_2m_max[i],rain:d.precipitation_sum[i],gust:d.wind_gusts_10m_max[i]}));
    S.fc[g.id]={key,at:Date.now(),days,kind:fcKind(days)};
  }catch(e){console.warn('Weer ophalen mislukt',e);S.fc[g.id]={key,at:Date.now(),error:true}}
  schedule();
}
function weatherOf(gid){
  const w=S.weather.find(x=>x.id===gid);
  if(w&&w.kind&&w.setAt&&diff(String(w.setAt).slice(0,10),today())<=7)return {...w,manual:true};
  const f=S.fc[gid];
  if(f&&f.days)return {kind:f.kind,auto:true};
  return {kind:'normaal'};

/* klaar = er is binnen `days` dagen een logregel met deze taakcode */
const doneRecently=(key,days)=>S.logs.some(l=>l.taskKey===key&&l.date&&diff(l.date,today())<=days);
function todo(gid){
  if(gKind(gid)==='siertuin')return sierTodo(gid);
  const out=[],t=today(),m=new Date().getMonth()+1,wx=weatherOf(gid).kind;
  const beds=bedsOf(gid),bedName=id=>S.beds.find(b=>b.id===id)?.name||'?';
  const add=(prio,key,title,detail,extra={})=>{if(key&&extra.every&&doneRecently(key,extra.every))return;out.push({prio,key,title,detail,...extra})};
  // zaai- en oogstmomenten
  tasks(gid).filter(x=>!(x.kind==='Oogst verwacht'&&x.date<t)).forEach(x=>add(x.date<t?1:x.date<=addDays(t,7)?2:3,null,`${x.kind}: ${x.p.crop}`,`${bedName(x.p.bedId)} · ${x.date<t?'te laat, gepland '+fmt(x.date):fmt(x.date)}`,{plant:x.p,date:x.date}));
  S.plantings.filter(p=>p.gardenId===gid&&p.status!=='afgerond'&&p.status!=='gepland').forEach(p=>{
    const c=cropBy(p.crop),st=stageOf(p),b=S.beds.find(x=>x.id===p.bedId),bn=bedName(p.bedId),out_=!isKas(b);
    if(st===5&&p.status!=='oogst')add(2,null,`Kijk of ${p.crop} oogstbaar is`,`${bn} · verwachte oogst was ${fmt(expHarvest(p))}`,{plant:p});
    if(p.status==='oogst'&&PICK.has(p.crop)&&c?.o.includes(m))add(2,'pick:'+p.id,`${p.crop} plukken`,`${bn} · elke 2 à 3 dagen, dan blijft de plant dragen`,{every:2,plant:p});
    if(p.status==='oogst'&&diff(expHarvest(p),t)>60)add(3,null,`Is ${p.crop} uitgeoogst?`,`${bn} · rond af, dan komt het bed vrij voor opvolgteelt`,{plant:p});
    if(c&&dense(c)&&st===2)add(2,'thin:'+p.id,`${p.crop} uitdunnen`,`${bn} · houd ±${c.s[1]} cm tussen de plantjes`,{every:999,plant:p});
    if(SUPPORT.has(p.crop)&&st>=3&&st<=4)add(2,'support:'+p.id,`${p.crop} opbinden of steun geven`,`${bn}`,{every:14,plant:p});
    if(p.crop==='Tomaat'&&st>=3&&m>=6&&m<=9)add(2,'dief:'+p.id,'Dieven uit de tomaten halen',`${bn} · de scheuten in de oksels van de bladeren`,{every:7,plant:p});
    if(EARTHUP.has(p.crop)&&st>=3&&st<=4)add(3,'earth:'+p.id,`${p.crop} aanaarden`,`${bn} · grond tegen de stengels ophogen`,{every:21,plant:p});
    if(out_&&TENDER.has(p.crop)&&(wx==='vorst'||m>=10||m<=4))add(wx==='vorst'?1:2,'frost:'+p.id,`${p.crop} beschermen of binnenhalen`,`${bn} · ${wx==='vorst'?'vorst verwacht, ':''}dit gewas kan niet tegen vorst. Oogst wat rijp is of dek af met vliesdoek`,{every:3,plant:p});
    if(wx==='regen'&&SLUGS.has(p.crop)&&st>=2&&st<=4)add(2,'slak:'+p.id,`Let op slakken bij ${p.crop}`,`${bn} · na veel regen zijn ze actief, vooral bij jonge planten`,{every:4,plant:p});
    if(wx==='storm'&&SUPPORT.has(p.crop)&&st>=3)add(1,'storm:'+p.id,`Steunen van ${p.crop} controleren`,`${bn} · storm verwacht`,{every:3,plant:p});
  });
  beds.forEach(b=>{
    const act=plantsOf(b.id).filter(p=>p.status!=='afgerond'&&p.status!=='gepland');
    const growing=m>=4&&m<=9;
    if(act.length){
      const wDays=isKas(b)?(growing?2:6):(wx==='droog'?2:null);
      if(wDays&&wx!=='regen'||isKas(b)&&wDays){const key='water:'+b.id;if(!S.logs.some(l=>l.bedId===b.id&&l.type==='water'&&diff(l.date,t)<wDays))add(isKas(b)&&growing||wx==='droog'?1:2,key,`Water geven: ${b.name}`,isKas(b)?'in de kas regent het niet':'warm en droog weer',{bed:b,water:true})}
      if(isKas(b)&&(wx==='droog'||growing&&m>=5&&m<=8))add(2,'lucht:'+b.id,`Kas luchten: ${b.name}`,'zet op zonnige dagen deur of ramen open tegen schimmel en hitte',{every:1,bed:b});
      if(isKas(b)&&wx==='storm')add(1,'kasdicht:'+b.id,`Kas dichtdoen: ${b.name}`,'storm verwacht, sluit deuren en ramen',{every:1,bed:b});
    }else{
      if(m>=3&&m<=8)add(3,'leeg:'+b.id,`${b.name} staat leeg`,'kijk bij opvolgteelt wat er nu nog in kan',{every:14,bed:b,open:true});
      if(m>=9&&m<=11&&!isKas(b))add(3,'groen:'+b.id,`${b.name} klaarmaken voor de winter`,'zaai een groenbemester of dek de grond af met blad of compost',{every:30,bed:b,open:true});
    }
  });
  return out.sort((a,b)=>a.prio-b.prio||String(a.date||'').localeCompare(String(b.date||'')));

function weatherBar(gid){

function sierTodo(gid){
  const out=[],m=new Date().getMonth()+1,nm=m%12+1,wx=weatherOf(gid).kind,t=today();
  const add=(prio,key,title,detail,extra={})=>{if(key&&doneRecently(key,extra.every||120))return;out.push({prio,key,title,detail,...extra})};
  const split=txt=>{const i=txt.indexOf(':');return i>0?[txt.slice(0,i),txt.slice(i+1).trim()]:[txt,'']};
  const careTasks=(items,keyBase,label,where,icon,extra)=>items.forEach(([k,txt,months,every])=>{
    const [short,rest]=split(txt),key=`care:${keyBase}:${k}`;
    if(months.includes(m)){
      const last=!months.includes(nm);
      add(every?2:(last?1:2),key,`${label}: ${short.charAt(0).toLowerCase()+short.slice(1)}`,[rest,where].filter(Boolean).join(' · '),{every:every||120,icon,...extra});
    }else if(months.includes(nm)&&!every&&new Date().getDate()>=15){
      add(3,key,`${label}: ${short.charAt(0).toLowerCase()+short.slice(1)}`,[rest,'vanaf '+MONTHS[nm-1],where].filter(Boolean).join(' · '),{every:120,icon,...extra});
    }
  });
  /* planten: per soort samengenomen */
  const groups={};
  plantsIn(gid).forEach(p=>{(groups[p.species]=groups[p.species]||[]).push(p)});
  Object.entries(groups).forEach(([name,ps])=>{
    const sp=specOf(ps[0]),label=ps.length>1?`${name} (${ps.length}×)`:name;
    const wh=[...new Set(ps.map(p=>shapeAt(gid,+p.x,+p.y)?.name).filter(Boolean))].join(', ');
    careTasks(sp.c,`${gid}:${name}`,label,wh,typeIcon(sp.t,22),{plantRef:ps[0]});
    if(sp.f&&wx==='vorst')add(1,`frost:${gid}:${name}`,`${label}: beschermen tegen vorst`,'vorst verwacht · dek af met vliesdoek of zet binnen',{every:3,icon:typeIcon(sp.t,22),plantRef:ps[0]});
    const young=ps.filter(p=>p.planted&&diff(p.planted,t)<365);
    if(young.length&&wx==='droog')add(1,`water:young:${gid}:${name}`,`${label}: water geven`,'nieuw geplant en warm, droog weer · geef ruim water bij de wortels',{every:2,icon:typeIcon(sp.t,22),water:true,plantRef:ps[0]});
    if(wx==='storm'&&(sp.t==='boom'||sp.t==='fruit')&&ps.some(p=>p.planted&&diff(p.planted,t)<730))add(1,`storm:${gid}:${name}`,`${label}: boompaal en banden controleren`,'storm verwacht',{every:3,icon:typeIcon(sp.t,22),plantRef:ps[0]});
  });
  /* vlakken: gazon, border, haag, vijver, terras */
  allBedsOf(gid).forEach(b=>{
    const items=shapeCare(b);if(!items.length)return;
    if(b.kind==='gazon'&&wx==='regen')return careTasks(items.filter(i=>i[0]!=='maai'),`${b.id}`,b.name,'',shapeIcon(b.kind),{bed:b});
    careTasks(items,`${b.id}`,b.name,'',shapeIcon(b.kind),{bed:b});
  });
  return out.sort((a,b)=>a.prio-b.prio||String(a.title).localeCompare(b.title,'nl'));
}

/* ---------- planning ---------- */
function tasks(gid){
  const t=today(),end=addDays(t,42),out=[];
  S.plantings.filter(p=>p.gardenId===gid).forEach(p=>{
    const b=S.beds.find(x=>x.id===p.bedId);const bn=b?b.name:'?';
    if(p.status==='gepland'&&p.sowDate&&p.sowDate<=end)out.push({date:p.sowDate,kind:'Zaaien / planten',p,bn});
    if((p.status==='gezaaid'||p.status==='uitgeplant')){const h=expHarvest(p);if(h&&h<=end)out.push({date:h,kind:'Oogst verwacht',p,bn})}
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function viewLog(){

    <div class="filters">${['alle',...Object.keys(LTYPES)].map(t=>`<button data-act="logfilter" data-v="${t}" aria-pressed="${S.logFilter===t}">${t==='alle'?'Alles':LTYPES[t]}</button>`).join('')}</div>

/* ---------- rotatie ---------- */
function rotWarn(bedId,fam,year,exclId){
  if(fam==='overig')return [];
  return S.plantings.filter(p=>p.bedId===bedId&&p.id!==exclId&&famOf(p)===fam&&(p.year||THISY)<year&&(p.year||THISY)>=year-3).map(p=>p.year);
}
function viewRotation(){
  const g=G(); const beds=bedsOf(g.id); const years=[THISY-3,THISY-2,THISY-1,THISY,THISY+1];
  const fams=Object.keys(FAM).filter(f=>f!=='overig');
  const rows=beds.map(b=>{
    const ps=plantsOf(b.id);
    const cells=years.map(y=>{const list=ps.filter(p=>(p.year||THISY)===y);
      return `<td>${list.length?`<div class="row" style="gap:4px">${list.map(p=>{const w=rotWarn(b.id,famOf(p),y,p.id);return `<span class="chip${w.length?' warn':''}" style="${fc(famOf(p))}" title="${w.length?`${FAM[famOf(p)].n} stond hier ook in ${[...new Set(w)].join(', ')}`:FAM[famOf(p)].n}">${esc(p.crop)}${w.length?' !':''}</span>`}).join('')}</div>`:'<span class="muted">—</span>'}</td>`}).join('');
    const used=new Set(ps.filter(p=>(p.year||THISY)>=THISY-2&&(p.year||THISY)<=THISY).map(famOf));
    const ok=fams.filter(f=>!used.has(f));
    return `<tr><td><b>${esc(b.name)}</b>${isKas(b)?' <span class="tag">kas</span>':''}</td>${cells}<td>${ok.length?`<div class="row" style="gap:4px">${ok.slice(0,4).map(f=>`<span class="chip" style="${fc(f)}">${FAM[f].n}</span>`).join('')}</div>`:'<span class="muted">alles recent gebruikt</span>'}</td></tr>`;
  }).join('');
  return `<section class="stack"><div><span class="label">${esc(g.name)}</span><h2>Gewasrotatie</h2>
   <p class="muted" style="max-width:65ch">Zet dezelfde plantenfamilie niet binnen drie jaar terug in hetzelfde bed; zo blijven bodemziekten en plagen beperkt. Een gestippelde rand met ! betekent dat de familie daar kort geleden ook stond.${bedsOf(g.id).some(isKas)?' In een kas is wisselen lastig omdat je er vaak elk jaar tomaten of komkommers wilt. Wissel dan binnen de kas van plek, of vervang na drie jaar de bovenste 20 cm grond.':''}</p></div>
   <div class="legend">${fams.map(f=>`<span class="chip" style="${fc(f)}">${FAM[f].n}</span>`).join('')}</div>
   <div class="tscroll"><table><thead><tr><th>Bed</th>${years.map(y=>`<th>${y}${y===THISY?' · nu':''}</th>`).join('')}<th>Geschikt voor ${THISY+1}</th></tr></thead>
   <tbody>${rows||`<tr><td colspan="7" class="muted">Nog geen bedden in deze tuin.</td></tr>`}</tbody></table></div></section>`;
}

/* ---------- modal forms ---------- */
function openModal(title,body,onSubmit,extra){
  const root=$('#modalroot');
  root.innerHTML=`<div class="overlay" data-act="close-modal-bg"><form class="modal" id="mform" novalidate><div class="row between"><h2>${esc(title)}</h2><button type="button" class="btn small ghost" data-act="close-modal" aria-label="Sluiten">✕</button></div>
   ${body}<p class="err" id="merr" hidden></p><div class="row" style="justify-content:flex-end">${extra||''}<button type="button" class="btn" data-act="close-modal">Annuleren</button><button class="btn primary" type="submit">Opslaan</button></div></form></div>`;
  const f=$('#mform');
  f.addEventListener('submit',async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());const btn=f.querySelector('[type=submit]');btn.disabled=true;
    try{const msg=await onSubmit(fd);if(msg==='__keep')return;if(msg){showErr(msg);btn.disabled=false;return}closeModal()}catch(err){showErr(errText(err));btn.disabled=false}});
  const first=f.querySelector('input,select,textarea');first&&first.focus();
}
const showErr=m=>{const e=$('#merr');e.textContent=m;e.hidden=false};
const closeModal=()=>{$('#modalroot').innerHTML=''};
function errText(err){
  if(err?.code==='invalid_argument')return 'Opslaan is geweigerd door de database. Log opnieuw in en probeer het nog eens.';
  if(err?.code==='quota_exceeded')return 'De opslag is vol. Verwijder oude notities en probeer het opnieuw.';
  return 'Opslaan lukte niet. Probeer het zo nog eens.';
}

function edgeLenForm(b,i){

  async d=>{

function mapPos(e){

  const r=m.getBoundingClientRect(),W=+m.dataset.w,L=+m.dataset.l;
  const rx=(e.clientX-r.left)/r.width*W,ry=(e.clientY-r.top)/r.height*L;
  return {rx,ry,x:clamp(snap(rx),0,W),y:clamp(snap(ry),0,L),W,L,r};
}

  }
  if(S.draw){
    e.preventDefault();
    const p=mapPos(e),d=S.draw;
    if(d.pts.length>=3){const [fx,fy]=d.pts[0];if(Math.hypot((fx-p.rx)/p.W*p.r.width,(fy-p.ry)/p.L*p.r.height)<14){finishDraw();return}}
    const g=G();
    if(d.kind!=='outline'&&!inGarden(g,p.x,p.y)){flash('Dit punt ligt buiten de tuin.');return}
    if(d.kind!=='outline'&&d.kind!=='gazon'){const hit=allBedsOf(g.id).find(b=>{if(b.kind==='gazon')return false;const q=shapeOf(b);return inPoly(p.x,p.y,q)&&!onEdge(p.x,p.y,q)});if(hit){flash(`Dit punt ligt in ${hit.name}.`);return}}
    S.flash='';
    const last=d.pts[d.pts.length-1];
    if(!last||last[0]!==p.x||last[1]!==p.y)d.pts.push([p.x,p.y]);
    render();return;
  }
  if(!S.layout)return;
  const pl=e.target.closest('.plt');
  if(pl){const pp=S.plants.find(x=>x.id===pl.dataset.id);if(!pp)return;const p0=mapPos(e);
    drag={mode:'pl',pp,sx:e.clientX,sy:e.clientY,start:[p0.rx,p0.ry],ox:+pp.x,oy:+pp.y,nx:+pp.x,ny:+pp.y,moved:false,W:p0.W,L:p0.L};
    try{map.setPointerCapture(e.pointerId)}catch(_){};e.preventDefault();return}
  const vh=e.target.closest('.vh'),mh=e.target.closest('.mh'),shp=e.target.closest('.shp');
  if(mh){
    e.preventDefault();const b=S.beds.find(x=>x.id===S.sel);if(!b)return;
    const pts=shapeOf(b),i=+mh.dataset.mi,[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length],np=[r3((x1+x2)/2),r3((y1+y2)/2)];
    if(pts.some(q=>q[0]===np[0]&&q[1]===np[1]))return;
    pts.splice(i+1,0,np);saveShape(b,pts);return;
  }
  if(!vh&&!shp)return;
  const b=S.beds.find(x=>x.id===(vh?S.sel:shp.dataset.id));if(!b)return;
  const p=mapPos(e);
  drag={b,mode:vh?'v':'mv',vi:vh?+vh.dataset.vi:-1,sx:e.clientX,sy:e.clientY,start:[p.rx,p.ry],orig:shapeOf(b),pts:null,moved:false,W:p.W,L:p.L};
  try{map.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(S.draw&&!drag){
    const d=S.draw,last=d.pts[d.pts.length-1],ln=$('#dline'),lb=$('#dlen');if(!last||!ln||!lb)return;
    const p=mapPos(e);if(!p||p.rx<-0.5||p.ry<-0.5||p.rx>p.W+0.5||p.ry>p.L+0.5){ln.style.display='none';lb.style.display='none';return}
    ln.setAttribute('x1',last[0]);ln.setAttribute('y1',last[1]);ln.setAttribute('x2',p.x);ln.setAttribute('y2',p.y);ln.style.display='';
    lb.textContent=fmtLen(Math.hypot(p.x-last[0],p.y-last[1]));lb.style.left=(last[0]+p.x)/2/p.W*100+'%';lb.style.top=(last[1]+p.y)/2/p.L*100+'%';lb.style.display='';
    return;
  }
  if(!drag)return;const d=drag;
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<4)return;
  d.moved=true;
  const p=mapPos(e);if(!p)return;
  if(d.mode==='pl'){
    const x=Math.round((d.ox+p.rx-d.start[0])*20)/20,y=Math.round((d.oy+p.ry-d.start[1])*20)/20;
    if(!inGarden(G(),x,y))return;d.nx=x;d.ny=y;
    const c=document.querySelector(`.plt[data-id="${CSS.escape(d.pp.id)}"]`);if(c){c.setAttribute('cx',x);c.setAttribute('cy',y);const dot=c.nextElementSibling;if(dot){dot.setAttribute('cx',x);dot.setAttribute('cy',y)}}
    return;
  }
  let pts;
  if(d.mode==='mv'){
    const bb=bbox(d.orig);
    const dx=clamp(snap(p.rx-d.start[0]),-bb.x,d.W-bb.x-bb.w),dy=clamp(snap(p.ry-d.start[1]),-bb.y,d.L-bb.y-bb.h);
    pts=d.orig.map(([x,y])=>[Math.round((x+dx)*100)/100,Math.round((y+dy)*100)/100]);
  }else{pts=d.orig.map(q=>q.slice());pts[d.vi]=[p.x,p.y]}
  if(!fitsGarden(G(),pts)||overlapsWith(G(),pts,d.b.id,d.b.kind).length)return;
  d.pts=pts;
  const el=document.querySelector(`.shp[data-id="${CSS.escape(d.b.id)}"]`);if(el)el.setAttribute('points',pts.map(q=>q.join(',')).join(' '));
  document.querySelectorAll('.vh').forEach(h=>{const q=pts[+h.dataset.vi];if(q){h.style.left=q[0]/d.W*100+'%';h.style.top=q[1]/d.L*100+'%'}});
  document.querySelectorAll('.mh').forEach(h=>{const i=+h.dataset.mi,a=pts[i],c=pts[(i+1)%pts.length];if(a&&c){h.style.left=(a[0]+c[0])/2/d.W*100+'%';h.style.top=(a[1]+c[1])/2/d.L*100+'%'}});
});
async function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(d.mode==='pl'){
    S.noClick=true;setTimeout(()=>{S.noClick=false},50);
    if(d.moved&&(d.nx!==d.ox||d.ny!==d.oy)){d.pp.x=d.nx;d.pp.y=d.ny;schedule();try{await S.db.doc('plants/'+d.pp.id).update({x:d.nx,y:d.ny})}catch(err){flash(errText(err))}return}
    if(!d.moved){S.selPlant=d.pp.id;S.sel=null}
    schedule();return;
  }
  if(d.moved&&d.pts){
    S.noClick=true;setTimeout(()=>{S.noClick=false},50);
    if(d.pts.some((q,i)=>q[0]!==d.orig[i][0]||q[1]!==d.orig[i][1])){await saveShape(d.b,d.pts);return}
  }else if(!d.moved&&d.mode==='mv'){S.sel=d.b.id;S.selPlant=null;S.noClick=true;setTimeout(()=>{S.noClick=false},50)}
  schedule();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('dblclick',e=>{
  const vh=e.target.closest('.vh');if(!vh||!S.layout)return;
  const b=S.beds.find(x=>x.id===S.sel);if(!b)return;
  const pts=shapeOf(b);if(pts.length<=3)return;
  pts.splice(+vh.dataset.vi,1);saveShape(b,pts);
});

document.addEventListener('change',e=>{if(e.target.id==='gpick'){S.gid=e.target.value;S.sel=null;store.set('mt.gid',S.gid);render()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#modalroot').innerHTML)closeModal();else if(S.draw){S.draw=null;render()}else if(S.place){S.place=null;render()}});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='close-modal-bg'){if(e.target===el)closeModal();return}
  try{
  switch(a){
    case 'view':S.view=el.dataset.v;store.set('mt.view',S.view);render();break;
    case 'close-modal':closeModal();break;
    case 'select-bed':if(S.draw||S.place)break;if(S.noClick){S.noClick=false;break}S.sel=id;S.selPlant=null;if(el.dataset.goto){S.view='kaart';store.set('mt.view','kaart')}render();break;
    case 'layout':S.layout=!S.layout;S.draw=null;render();break;
    case 'draw':S.draw={kind:el.dataset.k,gid:G().id,pts:[]};S.sel=null;render();break;
    case 'draw-done':await finishDraw();break;
    case 'edge-len':{const b=S.beds.find(x=>x.id===S.sel);if(b)edgeLenForm(b,+el.dataset.ei);break}
    case 'rotate':case 'mirror':{const b=S.beds.find(x=>x.id===S.sel);if(!b)break;const np=a==='rotate'?rotate90(shapeOf(b)):mirrorX(shapeOf(b));
      if(placeError(G(),np,b.id,'Het bed')){const spot=findSpot(G(),np,b.id);if(!spot||!spot.free){flash('Zo past het bed nergens: het komt buiten de tuin of op een ander bed.');break}await saveShape(b,spot.pts);flash('Gedraaid en verplaatst naar een vrije plek.');break}
      await saveShape(b,np);break}
    case 'draw-undo':if(S.draw){S.draw.pts.pop();render()}break;
    case 'draw-cancel':S.draw=null;render();break;
    case 'outline-clear':armed(el,async()=>{const g=G();g.outline=null;schedule();await S.db.doc('gardens/'+g.id).update({outline:null})});break;
    case 'succ':plantForm(el.dataset.bed,null,{crop:el.dataset.crop,sowDate:el.dataset.date});break;
    case 'deselect':S.sel=null;S.selPlant=null;render();break;
    case 'select-plant':if(S.draw||S.place)break;if(S.noClick){S.noClick=false;break}S.selPlant=id;S.sel=null;if(S.view!=='kaart'){S.view='kaart';store.set('mt.view','kaart')}render();break;
    case 'add-plantx':sierPlantForm();break;
    case 'edit-plantx':sierPlantForm(S.plants.find(x=>x.id===id));break;
    case 'del-plantx':armed(el,async()=>{closeModal();S.selPlant=null;await S.db.doc('plants/'+id).delete()});break;
    case 'place-cancel':S.place=null;render();break;
    case 'draw-sier':S.draw={kind:$('#drawkind').value,gid:G().id,pts:[]};S.sel=null;S.selPlant=null;render();break;
    case 'add-garden':gardenForm();break;
    case 'edit-garden':gardenForm(G());break;
    case 'add-bed':bedForm();break;
    case 'edit-bed':bedForm(S.beds.find(b=>b.id===id));break;
    case 'add-plant':plantForm(el.dataset.bed);break;
    case 'edit-plant':{const p=S.plantings.find(x=>x.id===id);plantForm(p.bedId,p);break}
    case 'add-log':logForm(el.dataset.bed,el.dataset.plant,el.dataset.plantx);break;
    case 'logfilter':S.logFilter=el.dataset.v;render();break;
    case 'weather-auto':{const g=G();el.disabled=true;await S.db.doc('weather/'+g.id).delete();break}
    case 'logout':el.disabled=true;await window.MT.signOut();break;
    case 'profile':openModal('Je naam',`${fld('Naam die anderen zien',inp('dname',S.myName||'','required'),true)}`,async d=>{const n=d.dname.trim();if(!n)return 'Vul een naam in.';await window.MT.setName(n);S.myName=n;$('#who').textContent=n;schedule()});break;
    case 'weather':{const g=G();el.disabled=true;await S.db.doc('weather/'+g.id).set({kind:el.dataset.v,setAt:new Date().toISOString(),setBy:S.me});break}
    case 'todo-done':{const g=G();el.disabled=true;const p=S.plantings.find(x=>x.id===el.dataset.plant);
      const pr=S.plants.find(x=>x.id===el.dataset.plantref);
      await S.db.collection('logs').doc().set({gardenId:g.id,bedId:el.dataset.bed||'',plantingId:el.dataset.plant||'',plantId:pr?.id||'',crop:p?.crop||pr?.species||'',date:today(),type:el.dataset.water?'water':'werk',amount:0,unit:'',text:el.dataset.title,taskKey:el.dataset.key,createdBy:S.me,createdAt:new Date().toISOString()});break}
    case 'calmine':S.calMine=!!el.dataset.v;render();break;
    case 'load-example':el.disabled=true;el.textContent='Bezig…';await loadExample();break;
    case 'next':{const p=S.plantings.find(x=>x.id===id);const n=FLOW[FLOW.indexOf(p.status)+1];if(!n)break;el.disabled=true;
      const upd={status:n};if(p.status==='gepland'&&p.sowDate>today()){upd.sowDate=today();upd.year=THISY}
      await S.db.doc('plantings/'+id).update(upd);break}
    case 'del-log':armed(el,()=>S.db.doc('logs/'+id).delete());break;
    case 'del-plant':armed(el,async()=>{await S.db.doc('plantings/'+id).delete();closeModal()});break;
    case 'del-bed':armed(el,async()=>{S.sel=null;await delMany('plantings',plantsOf(id));await delMany('logs',S.logs.filter(l=>l.bedId===id));await S.db.doc('beds/'+id).delete()});break;
    case 'del-garden':armed(el,async()=>{closeModal();await delMany('logs',S.logs.filter(l=>l.gardenId===id));await delMany('plantings',S.plantings.filter(p=>p.gardenId===id));await delMany('beds',S.beds.filter(b=>b.gardenId===id));await delMany('plants',S.plants.filter(p=>p.gardenId===id));await S.db.doc('gardens/'+id).delete();S.gid=null;schedule()});break;
  }}catch(err){console.error(err);if(err?.code==='invalid_argument'){S.canWrite=false;document.body.classList.add('readonly');render()}}
});
render();
</script>
